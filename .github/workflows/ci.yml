name: Enterprise CI Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-matrix:
    name: Test Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - os: ubuntu-latest
            python-version: "3.14-dev"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]" || python -m pip install -e . pytest pytest-asyncio pytest-cov

      - name: Run PyTest Test Suite
        run: |
          python -m pytest -v --tb=short --cov=android_mcp --cov-report=xml --cov-report=term

      - name: Run Evals Benchmark Suite
        run: |
          python evals/evaluators/eval_runner.py

      - name: Run Enterprise Quality Gates (Gate 1 & Gate 2)
        run: |
          python skills/code-analyzer/scripts/analyze.py

      - name: Run Environment Healthcheck (Doctor)
        run: |
          python skills/android-doctor/scripts/doctor.py

      - name: Upload Test Coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v4
        continue-on-error: true
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
