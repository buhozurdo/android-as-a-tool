version: "1.0"
description: "Validation and sanitization rules for outputs emitted by MCP tools and the Android device"

rules:
  - id: "leak-prevention"
    description: "Detects and redacts credentials before returning outputs to LLM callers"
    action: "redact"
    severity: "critical"
    patterns:
      - "(?i)sk-[a-zA-Z0-9]{20,}"
      - "(?i)ghp_[a-zA-Z0-9]{36}"
      - "(?i)AKIA[0-9A-Z]{16}"
      - "(?i)AIza[0-9A-Za-z-_]{35}"
      - "(?i)bearer\\s+[a-zA-Z0-9_\\-\\.]{20,}"
      - "(?i)(api[_-]?key|secret|password|token)\\s*[:=]\\s*['\"][^'\"]+['\"]"

  - id: "json-structure-check"
    description: "Validates JSON structural syntax for tool outputs such as get_screen_elements"
    action: "validate_json"
    severity: "high"

  - id: "notification-pii-scrub"
    description: "Masks bank account and card identifiers while preserving OTP verification codes"
    action: "mask"
    severity: "medium"
    patterns:
      - "(?i)(account|card|iban|wire)\\s*#?\\s*\\d{6,16}"
